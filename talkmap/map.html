
    <!DOCTYPE html>
    <html>
    <head>
    	<title>Leaflet debug page</title>

    	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.0.0-beta.2/leaflet.css" />
    	<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.0.0-beta.2/leaflet.js"></script>
    	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    	<link rel="stylesheet" href="leaflet_dist/screen.css" />

    	<link rel="stylesheet" href="leaflet_dist/MarkerCluster.css" />
    	<link rel="stylesheet" href="leaflet_dist/MarkerCluster.Default.css" />
    	<script src="leaflet_dist/leaflet.markercluster-src.js"></script>
    	<script src="org-locations.js"></script>

    </head>
    <body>

    	<div id="map"></div>
    	<span>Mouse over a cluster to see the bounds of its children and click a cluster to zoom to those bounds</span>
    	<script type="text/javascript">
    		var tiles = L.tileLayer('http://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
              maxZoom: 18,
              attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012'
                    }),
    			latlng = L.latLng(30, 10);
    		var map = L.map('map', {center: latlng, zoom: 0.7, layers: [tiles]});
    		var markers = L.markerClusterGroup({
    			showCoverageOnHover: false,
    			maxClusterRadius: 80
    			});
    		
function markerColor(title) {

    if(title.includes("[Seminar]"))
        return "yellow";

    if(title.includes("[Poster]"))
        return "blue";

    if(title.includes("[Invited talk]"))
        return "red";

    if(title.includes("[Invited review]"))
        return "darkred";

    if(title.includes("[Invited lecture]"))
        return "darkred";

    if(title.includes("[Oral contribution]"))
        return "green";

    return "orange";
}

for (var i = 0; i < addressPoints.length; i++) {

    			var a = addressPoints[i];
    			var title = a[0];
    			
var iconColor = markerColor(title);

var marker = L.marker(
    new L.LatLng(a[1], a[2]),
    {
        title: title,
        icon: new L.Icon({
            iconUrl:
                'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-' +
                iconColor +
                '.png',
            shadowUrl:
                'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        })
    }
);

    			marker.bindPopup(title);
    			markers.addLayer(marker);
    		}
    		map.addLayer(markers);
    		
map.zoomIn();

var legend = L.control({position: 'bottomright'});

legend.onAdd = function () {

    var div = L.DomUtil.create('div', 'info legend');

    div.style.backgroundColor = 'white';
    div.style.padding = '10px';
    div.style.border = '1px solid #999';

    div.innerHTML =
        '<b>Talk type</b><br>' +
        '<i style="background:red;width:12px;height:12px;display:inline-block;margin-right:5px;"></i> Invited talk<br>' +
        '<i style="background:darkred;width:12px;height:12px;display:inline-block;margin-right:5px;"></i> Invited review / lecture<br>' +
        '<i style="background:green;width:12px;height:12px;display:inline-block;margin-right:5px;"></i> Oral contribution<br>' +
        '<i style="background:blue;width:12px;height:12px;display:inline-block;margin-right:5px;"></i> Poster<br>' +
        '<i style="background:yellow;width:12px;height:12px;display:inline-block;margin-right:5px;"></i> Seminar';

    return div;
};

legend.addTo(map);

    	</script>
    </body>
    </html>
